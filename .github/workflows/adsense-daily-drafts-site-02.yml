name: 사이트 2 매일 임시글 생성

on:
  schedule:
    # GitHub Actions cron은 UTC 기준입니다. 23:00 UTC = 다음 날 08:00 Asia/Seoul.
    - cron: "0 23 * * *"

permissions:
  contents: write

# 사이트 1 기록 저장과 동시에 push하지 않도록 같은 대기 줄을 사용합니다.
concurrency:
  group: adsense-daily-drafts-write-history
  cancel-in-progress: false

jobs:
  create-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 99_절대_건들지마세요_프로그램파일/package-lock.json

      - name: 프로그램 설치
        working-directory: 99_절대_건들지마세요_프로그램파일
        run: npm ci

      - name: 사이트 2 임시글 3개 생성
        id: site_2
        continue-on-error: true
        working-directory: 99_절대_건들지마세요_프로그램파일
        env:
          MAKEIT_MIDDLE_LICENSE: ${{ secrets.MAKEIT_MIDDLE_LICENSE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADSENSE_SITE_02_URL: ${{ secrets.ADSENSE_SITE_02_URL }}
          ADSENSE_SITE_02_USER: ${{ secrets.ADSENSE_SITE_02_USER }}
          ADSENSE_SITE_02_APP_PASSWORD: ${{ secrets.ADSENSE_SITE_02_APP_PASSWORD }}
        run: npm run adsense:create-drafts -- --site=2 --limit=3 --child-categories=next-3 --date-mode=now

      - name: GitHub 작성자 정보 설정
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 작성 기록 안전 저장
        if: always()
        working-directory: 99_절대_건들지마세요_프로그램파일
        run: npm run save

      - name: 자동화 결과 확인
        if: always()
        run: |
          if [ "${{ steps.site_2.outcome }}" != "success" ]; then
            echo "사이트 2 생성 단계에서 확인이 필요한 오류가 발생했습니다."
            exit 1
          fi
