name: 사이트 3 임시글 2개 일회성 시험

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: adsense-daily-drafts-site-03
  cancel-in-progress: false

jobs:
  trial:
    if: github.repository == 'kkamskim22-cell/makeit-middle-kit' && github.ref == 'refs/heads/main' && github.run_number == 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 사이트 3 정기 자동화 비활성 상태 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/adsense-daily-drafts-site-03.yml" --jq .state)
          echo "site-03 automation: $state"
          test "$state" = disabled_manually
      - name: 저장소 가져오기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Node.js 준비
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: 모의 응답 테스트
        working-directory: 99_절대_건들지마세요_프로그램파일
        run: node --test test/site-03-draft-trial.test.mjs
      - name: 사이트 3 비활성 상태 재확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/adsense-daily-drafts-site-03.yml" --jq .state)
          test "$state" = disabled_manually
      - name: 사이트 3 임시글 시험 생성 및 검증
        working-directory: 99_절대_건들지마세요_프로그램파일
        env:
          MAKEIT_MIDDLE_LICENSE: ${{ secrets.MAKEIT_MIDDLE_LICENSE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADSENSE_SITE_03_URL: ${{ secrets.ADSENSE_SITE_03_URL }}
          ADSENSE_SITE_03_USER: ${{ secrets.ADSENSE_SITE_03_USER }}
          ADSENSE_SITE_03_APP_PASSWORD: ${{ secrets.ADSENSE_SITE_03_APP_PASSWORD }}
        run: npm run adsense:create-drafts -- --site=3 --site-03-trial=1
      - name: 사이트 3 비활성 상태 최종 확인
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/adsense-daily-drafts-site-03.yml" --jq .state)
          echo "site-03 automation: $state"
          test "$state" = disabled_manually
