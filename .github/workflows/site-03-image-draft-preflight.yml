name: 사이트 3 이미지 초안 읽기 전용 사전 검증

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: site-03-image-draft-preflight
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'kkamskim22-cell/makeit-middle-kit' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 사이트 3 정기 자동화 비활성 상태 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/adsense-daily-drafts-site-03.yml" --jq .state)" = disabled_manually
      - name: 저장소 가져오기
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Node.js 준비
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: 읽기 전용 모의 테스트
        working-directory: 99_절대_건들지마세요_프로그램파일
        run: node --test test/site-03-image-draft-preflight.test.mjs
      - name: 사이트 3 카테고리와 제목 중복 GET 검증
        working-directory: 99_절대_건들지마세요_프로그램파일
        env:
          ADSENSE_SITE_03_URL: ${{ secrets.ADSENSE_SITE_03_URL }}
          ADSENSE_SITE_03_USER: ${{ secrets.ADSENSE_SITE_03_USER }}
          ADSENSE_SITE_03_APP_PASSWORD: ${{ secrets.ADSENSE_SITE_03_APP_PASSWORD }}
        run: node scripts/site-03-image-draft-preflight.mjs
      - name: 사이트 3 정기 자동화 비활성 상태 최종 확인
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/adsense-daily-drafts-site-03.yml" --jq .state)" = disabled_manually
