name: 사이트 3 이미지 포함 임시글 신규 일회성 시험

on:
  workflow_dispatch:
    inputs:
      parent_category_id:
        description: "읽기 전용 사전 검증으로 확인한 4-3 상위 카테고리 ID"
        required: true
      child_category_id:
        description: "읽기 전용 사전 검증으로 확인한 4-3 세부 카테고리 ID"
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: site-03-image-draft-followup
  cancel-in-progress: false

jobs:
  draft:
    if: github.repository == 'kkamskim22-cell/makeit-middle-kit' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 사이트 3 정기 자동화 비활성 상태 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/adsense-daily-drafts-site-03.yml" --jq .state)" = disabled_manually
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Runner 외부 IP 기록
        run: |
          runner_ip=$(curl --fail --silent --show-error --max-time 10 https://api.ipify.org)
          test -n "$runner_ip"
          echo "runner external IP: $runner_ip"
      - name: 승인된 신규 단일 실행 이력 확인
        working-directory: 99_절대_건들지마세요_프로그램파일
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/site-03-image-draft-successor-run-guard.mjs
      - name: 로컬 모의 테스트
        working-directory: 99_절대_건들지마세요_프로그램파일
        run: node --test test/site-03-draft-trial.test.mjs test/site-03-image-draft-article.test.mjs test/site-03-image-draft-safety.test.mjs test/site-03-image-draft-successor.test.mjs
      - name: 사이트 3 이미지 포함 임시글 생성과 검증
        working-directory: 99_절대_건들지마세요_프로그램파일
        env:
          MAKEIT_MIDDLE_LICENSE: ${{ secrets.MAKEIT_MIDDLE_LICENSE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ADSENSE_SITE_03_URL: ${{ secrets.ADSENSE_SITE_03_URL }}
          ADSENSE_SITE_03_USER: ${{ secrets.ADSENSE_SITE_03_USER }}
          ADSENSE_SITE_03_APP_PASSWORD: ${{ secrets.ADSENSE_SITE_03_APP_PASSWORD }}
        run: node scripts/site-03-image-draft-successor.mjs --parent-category-id=${{ inputs.parent_category_id }} --child-category-id=${{ inputs.child_category_id }}
      - name: 사이트 3 정기 자동화 비활성 상태 최종 확인
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/adsense-daily-drafts-site-03.yml" --jq .state)" = disabled_manually
