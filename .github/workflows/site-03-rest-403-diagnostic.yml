name: 사이트 3 REST 403 읽기 전용 진단

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-03-rest-403-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4
      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 사이트 3 REST 403 읽기 전용 진단
        working-directory: 99_절대_건들지마세요_프로그램파일
        env:
          ADSENSE_SITE_03_URL: ${{ secrets.ADSENSE_SITE_03_URL }}
          ADSENSE_SITE_03_USER: ${{ secrets.ADSENSE_SITE_03_USER }}
          ADSENSE_SITE_03_APP_PASSWORD: ${{ secrets.ADSENSE_SITE_03_APP_PASSWORD }}
        run: node scripts/site-03-rest-403-diagnostic.mjs
